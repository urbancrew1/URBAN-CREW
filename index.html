<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#061b27" name="theme-color"/>
<title>UrbanCrew — Cleaning services in Lithuania</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
:root{color-scheme:light}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.service-card{transition:transform .18s ease,box-shadow .18s ease}.service-card:hover{transform:translateY(-2px);box-shadow:0 14px 35px rgba(15,23,42,.08)}
.slot-btn[aria-pressed="true"]{background:#4338ca;color:white;border-color:#4338ca}.slot-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.active{background:#eef2ff;color:#4338ca}.modal-backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(4px)}.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<style>
:root{color-scheme:light} body{background:#edf5fa!important;color:#102f42!important;font-family:Inter,Arial,sans-serif!important}
header,footer{background:#061b27!important;color:#eefaff!important;border-color:#183746!important}
header a,footer a{color:inherit} header img[alt*="logo"],footer img[alt*="logo"]{object-fit:contain;max-height:58px}
main#customer-view{max-width:1280px!important}
#customer-view>section:first-of-type{background:radial-gradient(ellipse at 72% 30%,#0d4050,#092a39 40%,#061a25 80%)!important;border-radius:0!important;box-shadow:none!important}
#customer-view>section:first-of-type h1,#customer-view>section:first-of-type h2,#customer-view>section:first-of-type p,#customer-view>section:first-of-type label{color:#f4fbff!important}
#customer-view>section:first-of-type img:not([alt*="logo"]){display:none!important}
#customer-view section{border-radius:12px}
#customer-view section[id="cleaning-results"]{background:transparent!important;border:0!important;box-shadow:none!important}
#cleaning-results img{height:120px!important;object-fit:cover!important;border-radius:6px!important}
#cleaning-results article,#cleaning-results .service-card{background:#fff!important;border:1px solid #d7e5ee!important;border-radius:9px!important;overflow:hidden}
button,.btn-primary{background:#079b83!important;border-color:#079b83!important;color:#fff!important}
.nav-btn.active{background:#092b3b!important;color:white!important}
@media(max-width:650px){#cleaning-results img{height:150px!important}}
</style>
<style>header img[alt*="logo"],footer img[alt*="logo"]{display:block!important;object-fit:contain!important;max-height:58px!important;width:auto!important;max-width:min(260px,42vw)!important}</style>

<style id="urbancrew-brand-theme">
:root{--uc-bg:#091820;--uc-panel:#0d2028;--uc-teal:#176879;--uc-mint:#b8e6d6;--uc-rose:#d7a08f;--uc-text:#f4f7f8;--uc-muted:#b8c5cc}
html{scroll-behavior:smooth} body{background:var(--uc-bg)!important;color:var(--uc-text)!important}
header{background:rgba(7,20,28,.97)!important;border-color:rgba(183,213,222,.13)!important;color:#f4f7f8!important}
header a{color:inherit!important}.uc-brand{display:flex!important;align-items:center;gap:12px;text-decoration:none!important;min-width:max-content}.uc-emblem{width:48px;height:48px;object-fit:contain!important;max-height:48px!important;max-width:48px!important;display:block!important;filter:drop-shadow(0 2px 4px #0005)}
.uc-wordmark{font-size:27px;font-weight:750;letter-spacing:.02em;color:#e9f0f3;line-height:1}.uc-rose{color:var(--uc-rose)!important}
.uc-footer-mark{display:flex;align-items:center;gap:10px;font-weight:750;font-size:22px;min-width:0;overflow:visible}.uc-footer-mark img{display:block!important;flex:0 0 68px!important;width:68px!important;height:68px!important;min-width:68px!important;max-width:68px!important;max-height:68px!important;object-fit:contain!important;object-position:center!important;overflow:visible!important;border:0!important;padding:0!important;margin:0!important}
section{scroll-margin-top:85px} .bg-white,.bg-slate-50,.bg-gray-50{background-color:#f3f6f7!important;color:#122833!important}
.text-slate-900,.text-gray-900{color:#102631!important}.text-slate-600,.text-gray-600{color:#50636c!important}
.bg-emerald-600,.bg-emerald-700,.bg-indigo-600{background-color:#0d8f7e!important}.text-emerald-600{color:#169c8d!important}
button,a[class*="bg-emerald"],a[class*="bg-indigo"]{transition:filter .2s,transform .2s}button:hover,a[class*="bg-emerald"]:hover{filter:brightness(1.08)}
footer{background:#07141b!important;color:#dce6ea!important;border-color:#20343d!important;overflow:visible!important}footer p,footer span{color:inherit}footer .uc-footer-mark{overflow:visible!important}footer .uc-footer-mark img{object-fit:contain!important;object-position:center!important}
/* Hide any legacy hero photography; keep the cleaning-service content */
#customer-view>section:first-of-type img:not([alt*="logo"]):not(.uc-emblem){display:none!important}
@media(max-width:640px){.uc-emblem{width:42px;height:42px;max-width:42px!important;max-height:42px!important}.uc-wordmark{font-size:23px}.uc-brand{gap:8px}.uc-footer-mark img{flex-basis:60px!important;width:60px!important;height:60px!important;min-width:60px!important;max-width:60px!important;max-height:60px!important}}
</style>


<style id="urbancrew-service-photo-styles">
#services .service-photo{display:block!important;visibility:visible!important;opacity:1!important;background:linear-gradient(135deg,#dce9e8,#a9c6c4);width:100%!important;height:190px!important;max-height:none!important;max-width:100%!important;object-fit:cover!important;border-radius:12px!important;margin:0 0 16px!important;filter:none!important}
#services .service-card{padding:12px!important;overflow:hidden!important;border:1px solid rgba(23,104,121,.28)!important;border-radius:18px!important;background:#fff!important;color:#102f42!important}
#services .service-card .service-photo-wrap{position:relative;overflow:hidden;border-radius:12px}
#services .service-card .service-photo-label{position:absolute;left:10px;bottom:10px;background:rgba(6,27,39,.82);color:white;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
@media(max-width:640px){#services .service-photo{height:185px!important}}
</style>


<style id="urbancrew-footer-logo-final-fix">
/* Match footer emblem sizing to the full, uncropped header emblem */
footer .uc-footer-mark{display:flex!important;align-items:center!important;gap:12px!important;overflow:visible!important;min-height:88px!important;max-width:100%!important}
footer .uc-footer-mark img{display:block!important;flex:0 0 88px!important;width:88px!important;height:88px!important;min-width:88px!important;min-height:88px!important;max-width:88px!important;max-height:88px!important;object-fit:contain!important;object-position:center center!important;overflow:visible!important;transform:none!important;clip-path:none!important}
footer .uc-footer-mark span{display:inline-block!important;overflow:visible!important;white-space:nowrap!important}
footer,footer *{box-sizing:border-box}
@media(max-width:640px){footer .uc-footer-mark img{flex-basis:72px!important;width:72px!important;height:72px!important;min-width:72px!important;max-width:72px!important;min-height:72px!important;max-height:72px!important}}
</style>
</head>
